services:
  finance:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      FINANCE_DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - finance_data:/data
    # Run one application replica when using SQLite. Do not horizontally scale this container.
volumes:
  finance_data:
